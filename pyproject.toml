[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninecat"
version = "0.1.0"
description = "In-season analytics for 9-category head-to-head fantasy basketball: projections, G-scores, Monte Carlo matchups, trades and waivers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
nba = ["nba_api>=1.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
